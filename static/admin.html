<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>站長後台 | 澳洲超市特價優惠</title>
    <link rel="icon" type="image/png" href="/favicon-48.png">
    <style>
        :root {
            --bg: #f6f5f1; --surface: #ffffff; --surface-2: #efeee9; --ink: #1a1a18; --ink-2: #45443f; --ink-3: #6b6962;
            --line: #e4e2db; --accent: #1d6b47; --accent-soft: #e7f1ea; --sale: #c8321e; --warn: #9a6200; --warn-soft: #fbf1dc;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #121211; --surface: #1b1b1a; --surface-2: #242422; --ink: #f1f0ea; --ink-2: #cfcdc5; --ink-3: #a3a198;
                    --line: #2e2e2b; --accent: #5cbf8c; --accent-soft: #17291f; --sale: #ff7a66; --warn: #f0b44c; --warn-soft: #2a2213; }
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 -apple-system, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", sans-serif; }
        .wrap { max-width: 760px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); }
        h1 { font-size: 21px; margin: 0; }
        .sub { color: var(--ink-3); font-size: 13px; margin: 2px 0 0; }
        .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
        .btn { white-space: nowrap; height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
        .btn.small { height: 32px; padding: 0 12px; font-size: 12.5px; font-weight: 500; }
        .btn.danger { color: var(--sale); }
        .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
        .login { max-width: 380px; margin: 12vh auto 0; }
        .login input { width: 100%; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); padding: 0 14px; font-size: 16px; margin: 12px 0; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
        .stat b { display: block; font-size: 22px; }
        .stat span { font-size: 12px; color: var(--ink-3); }
        .filters { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .chip { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; cursor: pointer; color: var(--ink-2); }
        .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
        .item { margin-bottom: 10px; }
        .item.unread { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
        .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--ink-3); margin-bottom: 8px; }
        .tag { padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); }
        .tag.data_error { background: var(--warn-soft); color: var(--warn); }
        .tag.bug { background: #fde8e4; color: #b3261e; }
        .tag.suggestion { background: var(--accent-soft); color: var(--accent); }
        .msg { white-space: pre-wrap; word-break: break-word; margin: 0 0 12px; }
        .actions { display: flex; gap: 8px; }
        .empty { text-align: center; color: var(--ink-3); padding: 40px 0; }
        .err { color: var(--sale); font-size: 13px; min-height: 20px; }
        .hidden { display: none !important; }
        .tabs { display: flex; gap: 6px; padding: 4px; background: var(--surface-2); border-radius: 999px; margin-bottom: 16px; }
        .tab { flex: 1; height: 38px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-3); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
        .tab.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        .tab .dot { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 999px; background: var(--sale); color: #fff; font-size: 11px; line-height: 18px; }
        /* ---- visitor statistics ---- */
        .viz { --bar: #1baf7a; --bar-hover: #14915f; }
        @media (prefers-color-scheme: dark) { .viz { --bar: #199e70; --bar-hover: #22b884; } }
        .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
        @media (min-width: 640px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
        .kpi b { display: block; font-size: 26px; line-height: 1.15; font-variant-numeric: tabular-nums; }
        .kpi span { font-size: 12.5px; color: var(--ink-3); }
        .kpi small { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
        .chart-title { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 10px; }
        .chart-title h2 { font-size: 15px; margin: 0; }
        .chart-title span { font-size: 12px; color: var(--ink-3); }
        .bars { position: relative; display: flex; align-items: flex-end; gap: 2px; height: 160px; border-bottom: 1px solid var(--line); }
        .bars .col { flex: 1; height: 100%; display: flex; align-items: flex-end; cursor: default; }
        .bars .col i { display: block; width: 100%; background: var(--bar); border-radius: 4px 4px 0 0; min-height: 2px; transition: background .12s; }
        .bars .col:hover i, .bars .col:focus i { background: var(--bar-hover); }
        .bars .col.zero i { background: var(--line); }
        .xaxis { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-3); margin-top: 6px; }
        .tip { position: absolute; pointer-events: none; transform: translate(-50%, -100%); background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 9px; border-radius: 8px; white-space: nowrap; z-index: 5; }
        .split { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 14px; }
        @media (min-width: 640px) { .split { grid-template-columns: repeat(3, 1fr); } }
        .hb h3 { font-size: 13.5px; margin: 0 0 10px; }
        .hb .row { display: grid; grid-template-columns: 74px 1fr 42px; gap: 8px; align-items: center; font-size: 12.5px; margin-bottom: 7px; }
        .hb .row .track { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
        .hb .row .track i { display: block; height: 100%; background: var(--bar); border-radius: 999px; }
        .hb .row b { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
        details.tbl { margin-top: 12px; font-size: 13px; }
        details.tbl summary { cursor: pointer; color: var(--ink-3); }
        details.tbl table { width: 100%; border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
        details.tbl td, details.tbl th { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: right; }
        details.tbl td:first-child, details.tbl th:first-child { text-align: left; }
        .note { font-size: 12px; color: var(--ink-3); margin-top: 12px; line-height: 1.6; }
    </style>
</head>
<body>
<div class="wrap">
    <!-- login -->
    <div id="loginView" class="login card">
        <h1>站長後台</h1>
        <p class="sub">瀏覽統計與意見箱，只有站長能看。請輸入後台密碼。</p>
        <form onsubmit="event.preventDefault(); login();">
            <input id="pw" type="password" autocomplete="current-password" placeholder="後台密碼" required>
            <p id="loginErr" class="err"></p>
            <button class="btn primary" style="width:100%">登入</button>
        </form>
    </div>

    <!-- list -->
    <div id="listView" class="hidden">
        <div class="top">
            <div>
                <h1>站長後台</h1>
                <p class="sub">澳洲超市特價優惠</p>
            </div>
            <div style="display:flex;gap:8px">
                <button class="btn small" onclick="load()">重新整理</button>
                <button class="btn small" onclick="logout()">登出</button>
            </div>
        </div>
        <div class="tabs" role="tablist">
            <button class="tab on" data-tab="visits" onclick="showTab('visits')">📈 瀏覽統計</button>
            <button class="tab" data-tab="fb" onclick="showTab('fb')">💬 意見箱<span id="tabUnread" class="dot hidden"></span></button>
        </div>

        <section id="visitsView" class="viz">
            <div class="kpis">
                <div class="card kpi"><b id="kToday">-</b><span>今天訪客</span><small id="kTodayViews"></small></div>
                <div class="card kpi"><b id="kWeek">-</b><span>近 7 天訪客</span></div>
                <div class="card kpi"><b id="kMonth">-</b><span>近 30 天訪客</span><small id="kMonthViews"></small></div>
                <div class="card kpi"><b id="kAll">-</b><span>累計訪客</span><small id="kSince"></small></div>
            </div>
            <div class="card">
                <div class="chart-title"><h2>每天訪客人數（近 30 天）</h2><span>滑過或點長條看數字</span></div>
                <div class="bars" id="bars" role="img" aria-label="近 30 天每天訪客人數長條圖"></div>
                <div class="xaxis"><span id="xFrom"></span><span id="xMid"></span><span>今天</span></div>
                <details class="tbl"><summary>表格檢視</summary><table><thead><tr><th>日期</th><th>訪客</th><th>瀏覽次數</th></tr></thead><tbody id="tblBody"></tbody></table></details>
            </div>
            <div class="split">
                <div class="card hb"><h3>裝置（近 30 天訪客）</h3><div id="hbDevice"></div></div>
                <div class="card hb"><h3>語言</h3><div id="hbLang"></div></div>
                <div class="card hb"><h3>地區</h3><div id="hbRegion"></div></div>
            </div>
            <p class="note">「訪客」＝不同的手機或電腦（同一人一天內重複打開只算 1 位）；「瀏覽次數」＝網頁被打開的總次數。不記錄 IP、名字或信箱，也不算搜尋引擎機器人。從 2026 年 10 月開始統計；更早的資料可在 Cloudflare 後台的 Web Analytics 查看。</p>
            <p id="visitsErr" class="err"></p>
        </section>

        <section id="fbView" class="hidden">
        <div class="stats">
            <div class="card stat"><b id="sUnread">-</b><span>未讀</span></div>
            <div class="card stat"><b id="sMonth">-</b><span>本月收到</span></div>
            <div class="card stat"><b id="sTotal">-</b><span>全部</span></div>
        </div>
        <div class="filters" id="filters">
            <button class="chip on" data-f="all">全部</button>
            <button class="chip" data-f="unread">未讀</button>
            <button class="chip" data-f="suggestion">💡 建議</button>
            <button class="chip" data-f="data_error">🏷️ 價格/商品有誤</button>
            <button class="chip" data-f="bug">🐞 網站問題</button>
            <button class="chip" data-f="other">💬 其他</button>
        </div>
        <p id="listErr" class="err"></p>
        <div id="list"></div>
        </section>
    </div>
</div>

<script>
    const TYPE = { suggestion: '💡 建議', data_error: '🏷️ 價格/商品有誤', bug: '🐞 網站問題', other: '💬 其他' };
    const LANG = { zh: '中文', en: 'English', ja: '日本語', ko: '한국어' };
    let key = '';
    let items = [];
    let filter = 'all';
    try { key = localStorage.getItem('fb_admin_key') || ''; } catch (e) {}

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const api = (method, qs = '') => fetch('/api/feedback' + qs, { method, headers: { Authorization: 'Bearer ' + key } });

    async function login() {
        key = document.getElementById('pw').value.trim();
        const ok = await load(true);
        if (ok) { try { localStorage.setItem('fb_admin_key', key); } catch (e) {} }
    }
    function logout() {
        key = '';
        try { localStorage.removeItem('fb_admin_key'); } catch (e) {}
        document.getElementById('listView').classList.add('hidden');
        document.getElementById('loginView').classList.remove('hidden');
    }
    async function load(fromLogin) {
        const errEl = document.getElementById(fromLogin ? 'loginErr' : 'listErr');
        errEl.textContent = '';
        try {
            const res = await api('GET');
            const data = await res.json().catch(() => ({}));
            if (res.status === 401) { errEl.textContent = '密碼不對'; if (!fromLogin) logout(); return false; }
            if (res.status === 429) { errEl.textContent = '密碼錯太多次，為了安全已暫時鎖住，請一小時後再試'; return false; }
            if (!data.ok) { errEl.textContent = data.error === 'no_db' ? '資料庫還沒連接好（Cloudflare 設定中）' : '讀取失敗，請稍後再試'; return false; }
            items = data.items || [];
            const s = data.stats || {};
            document.getElementById('sUnread').textContent = s.unread || 0;
            document.getElementById('sMonth').textContent = s.this_month || 0;
            document.getElementById('sTotal').textContent = s.total || 0;
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('listView').classList.remove('hidden');
            render();
            return true;
        } catch (e) {
            errEl.textContent = '連線失敗，請檢查網路';
            return false;
        }
    }
    function render() {
        const list = items.filter(it => filter === 'all' || (filter === 'unread' ? !it.is_read : it.type === filter));
        const box = document.getElementById('list');
        if (!list.length) { box.innerHTML = '<div class="empty">目前沒有意見</div>'; return; }
        box.innerHTML = list.map(it => {
            const t = new Date(it.created_at).toLocaleString('zh-TW', { timeZone: 'Australia/Brisbane', hour12: false });
            return `<div class="card item ${it.is_read ? '' : 'unread'}">
                <div class="meta">
                    <span class="tag ${esc(it.type)}">${TYPE[it.type] || esc(it.type)}</span>
                    <span>${esc(t)}</span>
                    <span>· ${esc(LANG[it.lang] || it.lang || '-')} · ${esc(it.region || '-')} · ${esc(it.device || '-')}</span>
                </div>
                <p class="msg">${esc(it.message)}</p>
                <div class="actions">
                    <button class="btn small" onclick="markRead(${it.id}, ${it.is_read ? 0 : 1})">${it.is_read ? '標為未讀' : '標為已讀'}</button>
                    <button class="btn small danger" onclick="removeItem(${it.id})">刪除</button>
                </div>
            </div>`;
        }).join('');
    }
    async function markRead(id, read) {
        await api('PUT', `?id=${id}&read=${read}`);
        const it = items.find(x => x.id === id);
        if (it) it.is_read = read;
        load();
    }
    async function removeItem(id) {
        if (!confirm('確定要刪除這則意見？刪除後無法復原。')) return;
        await api('DELETE', `?id=${id}`);
        load();
    }
    document.getElementById('filters').addEventListener('click', (e) => {
        const b = e.target.closest('.chip');
        if (!b) return;
        filter = b.dataset.f;
        document.querySelectorAll('#filters .chip').forEach(x => x.classList.toggle('on', x === b));
        render();
    });
    // ---------------- visitor statistics ----------------
    const LANGN = { zh: '中文', en: 'English', ja: '日本語', ko: '한국어', other: '其他' };
    const DEVN = { mobile: '📱 手機', desktop: '💻 電腦', other: '其他' };
    const REGN = { QLD: '昆士蘭', NSW: '新南威爾斯', ACT: '坎培拉', VIC: '維多利亞', SA: '南澳', WA: '西澳', TAS: '塔斯馬尼亞', NT: '北領地', other: '其他' };
    const fmt = (n) => Number(n || 0).toLocaleString('zh-TW');
    const md = (d) => { const p = d.split('-'); return `${+p[1]}/${+p[2]}`; };
    function showTab(t) {
        document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
        document.getElementById('visitsView').classList.toggle('hidden', t !== 'visits');
        document.getElementById('fbView').classList.toggle('hidden', t !== 'fb');
        try { localStorage.setItem('admin_tab', t); } catch (e) {}
    }
    async function loadVisits() {
        const err = document.getElementById('visitsErr');
        err.textContent = '';
        try {
            const res = await fetch('/api/hit', { headers: { Authorization: 'Bearer ' + key } });
            const d = await res.json().catch(() => ({}));
            if (!d.ok) { err.textContent = d.error === 'no_db' ? '資料庫還沒連接好' : '讀取瀏覽統計失敗'; return; }
            const t = d.totals || {};
            document.getElementById('kToday').textContent = fmt(t.today_visitors);
            document.getElementById('kTodayViews').textContent = `瀏覽 ${fmt(t.today_views)} 次`;
            document.getElementById('kWeek').textContent = fmt(t.week_visitors);
            document.getElementById('kMonth').textContent = fmt(t.month_visitors);
            document.getElementById('kMonthViews').textContent = `瀏覽 ${fmt(t.month_views)} 次`;
            document.getElementById('kAll').textContent = fmt(t.all_visitors);
            document.getElementById('kSince').textContent = t.since ? `自 ${md(t.since)} 起` : '';
            drawBars(d.days || []);
            drawHB('hbDevice', d.device, DEVN);
            drawHB('hbLang', d.lang, LANGN);
            drawHB('hbRegion', d.region, REGN);
        } catch (e) { err.textContent = '連線失敗，請檢查網路'; }
    }
    function drawBars(days) {
        const box = document.getElementById('bars');
        const max = Math.max(1, ...days.map(x => x.visitors));
        box.innerHTML = days.map((x, i) => `<div class="col ${x.visitors ? '' : 'zero'}" tabindex="0" data-i="${i}"><i style="height:${Math.max(1.5, x.visitors / max * 100)}%"></i></div>`).join('') + '<div class="tip hidden" id="tip"></div>';
        document.getElementById('xFrom').textContent = days.length ? md(days[0].day) : '';
        document.getElementById('xMid').textContent = days.length > 15 ? md(days[15].day) : '';
        const tip = document.getElementById('tip');
        const show = (col) => {
            const x = days[+col.dataset.i];
            tip.innerHTML = `${md(x.day)}　訪客 <b>${fmt(x.visitors)}</b>　瀏覽 ${fmt(x.views)}`;
            const r = col.getBoundingClientRect(), b = box.getBoundingClientRect();
            const bar = col.querySelector('i').getBoundingClientRect();
            tip.style.left = Math.min(Math.max(r.left - b.left + r.width / 2, 70), b.width - 70) + 'px';
            tip.style.top = (bar.top - b.top - 6) + 'px';
            tip.classList.remove('hidden');
        };
        box.querySelectorAll('.col').forEach(c => {
            c.addEventListener('mouseenter', () => show(c));
            c.addEventListener('focus', () => show(c));
            c.addEventListener('click', () => show(c));
        });
        box.addEventListener('mouseleave', () => tip.classList.add('hidden'));
        document.getElementById('tblBody').innerHTML = days.slice().reverse().map(x => `<tr><td>${md(x.day)}</td><td>${fmt(x.visitors)}</td><td>${fmt(x.views)}</td></tr>`).join('');
    }
    function drawHB(id, rows, names) {
        rows = rows || [];
        const total = rows.reduce((s, r) => s + r.n, 0) || 1;
        document.getElementById(id).innerHTML = rows.length ? rows.map(r => {
            const pct = Math.round(r.n / total * 100);
            return `<div class="row"><span>${names[r.k] || r.k}</span><span class="track"><i style="width:${pct}%"></i></span><b>${pct}%</b></div>`;
        }).join('') : '<p class="sub">還沒有資料</p>';
    }

    const _origLoad = load;
    load = async function (fromLogin) {
        const ok = await _origLoad(fromLogin);
        if (ok) {
            loadVisits();
            const unread = +document.getElementById('sUnread').textContent || 0;
            const dot = document.getElementById('tabUnread');
            dot.textContent = unread; dot.classList.toggle('hidden', !unread);
            let tab = 'visits';
            try { tab = localStorage.getItem('admin_tab') || 'visits'; } catch (e) {}
            showTab(tab);
        }
        return ok;
    };
    if (key) load();
</script>
</body>
</html>
