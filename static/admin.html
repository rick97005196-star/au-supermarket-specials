<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>意見箱後台 | 澳洲超市特價優惠</title>
    <link rel="icon" type="image/png" href="/favicon-48.png">
    <style>
        :root {
            --bg: #f6f5f1; --surface: #ffffff; --surface-2: #efeee9; --ink: #1a1a18; --ink-2: #45443f; --ink-3: #6b6962;
            --line: #e4e2db; --accent: #1d6b47; --accent-soft: #e7f1ea; --sale: #c8321e; --warn: #9a6200; --warn-soft: #fbf1dc;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #121211; --surface: #1b1b1a; --surface-2: #242422; --ink: #f1f0ea; --ink-2: #cfcdc5; --ink-3: #a3a198;
                    --line: #2e2e2b; --accent: #5cbf8c; --accent-soft: #17291f; --sale: #ff7a66; --warn: #f0b44c; --warn-soft: #2a2213; }
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 -apple-system, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", sans-serif; }
        .wrap { max-width: 760px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); }
        h1 { font-size: 21px; margin: 0; }
        .sub { color: var(--ink-3); font-size: 13px; margin: 2px 0 0; }
        .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
        .btn { white-space: nowrap; height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
        .btn.small { height: 32px; padding: 0 12px; font-size: 12.5px; font-weight: 500; }
        .btn.danger { color: var(--sale); }
        .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
        .login { max-width: 380px; margin: 12vh auto 0; }
        .login input { width: 100%; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); padding: 0 14px; font-size: 16px; margin: 12px 0; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
        .stat b { display: block; font-size: 22px; }
        .stat span { font-size: 12px; color: var(--ink-3); }
        .filters { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .chip { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; cursor: pointer; color: var(--ink-2); }
        .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
        .item { margin-bottom: 10px; }
        .item.unread { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
        .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--ink-3); margin-bottom: 8px; }
        .tag { padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); }
        .tag.data_error { background: var(--warn-soft); color: var(--warn); }
        .tag.bug { background: #fde8e4; color: #b3261e; }
        .tag.suggestion { background: var(--accent-soft); color: var(--accent); }
        .msg { white-space: pre-wrap; word-break: break-word; margin: 0 0 12px; }
        .actions { display: flex; gap: 8px; }
        .empty { text-align: center; color: var(--ink-3); padding: 40px 0; }
        .err { color: var(--sale); font-size: 13px; min-height: 20px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
<div class="wrap">
    <!-- login -->
    <div id="loginView" class="login card">
        <h1>意見箱後台</h1>
        <p class="sub">只有站長能看。請輸入後台密碼。</p>
        <form onsubmit="event.preventDefault(); login();">
            <input id="pw" type="password" autocomplete="current-password" placeholder="後台密碼" required>
            <p id="loginErr" class="err"></p>
            <button class="btn primary" style="width:100%">登入</button>
        </form>
    </div>

    <!-- list -->
    <div id="listView" class="hidden">
        <div class="top">
            <div>
                <h1>💬 意見箱後台</h1>
                <p class="sub">所有匿名意見都存在這裡（信箱沒收到的也在）</p>
            </div>
            <div style="display:flex;gap:8px">
                <button class="btn small" onclick="load()">重新整理</button>
                <button class="btn small" onclick="logout()">登出</button>
            </div>
        </div>
        <div class="stats">
            <div class="card stat"><b id="sUnread">-</b><span>未讀</span></div>
            <div class="card stat"><b id="sMonth">-</b><span>本月收到</span></div>
            <div class="card stat"><b id="sTotal">-</b><span>全部</span></div>
        </div>
        <div class="filters" id="filters">
            <button class="chip on" data-f="all">全部</button>
            <button class="chip" data-f="unread">未讀</button>
            <button class="chip" data-f="suggestion">💡 建議</button>
            <button class="chip" data-f="data_error">🏷️ 價格/商品有誤</button>
            <button class="chip" data-f="bug">🐞 網站問題</button>
            <button class="chip" data-f="other">💬 其他</button>
        </div>
        <p id="listErr" class="err"></p>
        <div id="list"></div>
    </div>
</div>

<script>
    const TYPE = { suggestion: '💡 建議', data_error: '🏷️ 價格/商品有誤', bug: '🐞 網站問題', other: '💬 其他' };
    const LANG = { zh: '中文', en: 'English', ja: '日本語', ko: '한국어' };
    let key = '';
    let items = [];
    let filter = 'all';
    try { key = localStorage.getItem('fb_admin_key') || ''; } catch (e) {}

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const api = (method, qs = '') => fetch('/api/feedback' + qs, { method, headers: { Authorization: 'Bearer ' + key } });

    async function login() {
        key = document.getElementById('pw').value.trim();
        const ok = await load(true);
        if (ok) { try { localStorage.setItem('fb_admin_key', key); } catch (e) {} }
    }
    function logout() {
        key = '';
        try { localStorage.removeItem('fb_admin_key'); } catch (e) {}
        document.getElementById('listView').classList.add('hidden');
        document.getElementById('loginView').classList.remove('hidden');
    }
    async function load(fromLogin) {
        const errEl = document.getElementById(fromLogin ? 'loginErr' : 'listErr');
        errEl.textContent = '';
        try {
            const res = await api('GET');
            const data = await res.json().catch(() => ({}));
            if (res.status === 401) { errEl.textContent = '密碼不對'; if (!fromLogin) logout(); return false; }
            if (!data.ok) { errEl.textContent = data.error === 'no_db' ? '資料庫還沒連接好（Cloudflare 設定中）' : '讀取失敗，請稍後再試'; return false; }
            items = data.items || [];
            const s = data.stats || {};
            document.getElementById('sUnread').textContent = s.unread || 0;
            document.getElementById('sMonth').textContent = s.this_month || 0;
            document.getElementById('sTotal').textContent = s.total || 0;
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('listView').classList.remove('hidden');
            render();
            return true;
        } catch (e) {
            errEl.textContent = '連線失敗，請檢查網路';
            return false;
        }
    }
    function render() {
        const list = items.filter(it => filter === 'all' || (filter === 'unread' ? !it.is_read : it.type === filter));
        const box = document.getElementById('list');
        if (!list.length) { box.innerHTML = '<div class="empty">目前沒有意見</div>'; return; }
        box.innerHTML = list.map(it => {
            const t = new Date(it.created_at).toLocaleString('zh-TW', { timeZone: 'Australia/Brisbane', hour12: false });
            return `<div class="card item ${it.is_read ? '' : 'unread'}">
                <div class="meta">
                    <span class="tag ${esc(it.type)}">${TYPE[it.type] || esc(it.type)}</span>
                    <span>${esc(t)}</span>
                    <span>· ${esc(LANG[it.lang] || it.lang || '-')} · ${esc(it.region || '-')} · ${esc(it.device || '-')}</span>
                </div>
                <p class="msg">${esc(it.message)}</p>
                <div class="actions">
                    <button class="btn small" onclick="markRead(${it.id}, ${it.is_read ? 0 : 1})">${it.is_read ? '標為未讀' : '標為已讀'}</button>
                    <button class="btn small danger" onclick="removeItem(${it.id})">刪除</button>
                </div>
            </div>`;
        }).join('');
    }
    async function markRead(id, read) {
        await api('PUT', `?id=${id}&read=${read}`);
        const it = items.find(x => x.id === id);
        if (it) it.is_read = read;
        load();
    }
    async function removeItem(id) {
        if (!confirm('確定要刪除這則意見？刪除後無法復原。')) return;
        await api('DELETE', `?id=${id}`);
        load();
    }
    document.getElementById('filters').addEventListener('click', (e) => {
        const b = e.target.closest('.chip');
        if (!b) return;
        filter = b.dataset.f;
        document.querySelectorAll('#filters .chip').forEach(x => x.classList.toggle('on', x === b));
        render();
    });
    if (key) load();
</script>
</body>
</html>
