name: d1-setup-tmp
on: workflow_dispatch
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9289bcfaff4b5d32ee32e7b83bf4a687
        run: |
          out=$(npx -y wrangler@4 d1 create au-specials-feedback 2>&1 || true)
          echo "$out"
          echo "::warning::CREATE $(echo "$out" | tr '\n' ' ' | grep -oE 'database_id[^,}]*|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|already exists|Authentication error|not authorized|[0-9]{4,5}\]' | head -5 | tr '\n' ' ')"
          list=$(npx -y wrangler@4 d1 list --json 2>&1 || true)
          echo "$list"
          echo "::warning::LIST $(echo "$list" | tr '\n' ' ' | cut -c1-600)"
