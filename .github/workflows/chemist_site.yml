name: 小黃屋網站（全部商品清單＋上架）

# The stand-alone 小黃屋 (Chemist Warehouse) site, au-pharmacy-specials.pages.dev, built from chemist/.
#  * prices: the printed in-store catalogue, already read by the specials update (static/data/specials.json);
#    that update also puts this site online when the catalogue changes (auto_update.yml)
#  * every product the shop sells: the shop's public product sitemap, read here once a week
#    (scrapers/chemist_all.py, names and links only)
#  * the names in 中文 / 日本語 / 한국어: a few thousand more each day until all are done (scripts/translate_chemist.py)
on:
  schedule:
    - cron: '37 17 * * *'     # 3:37 AM Brisbane time every day: the product list itself is read once a week
                              # (scrapers/chemist_all.py skips it for 6 days); the daily run translates more names
    - cron: '37 9 * * *'      # 7:37 PM Brisbane: the AI allowance starts again each day at 6 PM Brisbane, so a second
                              # run translates more names (both skip the Tuesday-night week change, scripts/translate_chemist.py)
  push:
    branches: [main]
    paths:
      - 'chemist/**'
      - 'scripts/build_chemist.py'
      - 'scrapers/chemist_all.py'
      - '.github/workflows/chemist_site.yml'
  workflow_dispatch:

concurrency:
  group: chemist-site
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Read every product the shop sells (once a week)
        run: |
          pip install -q requests
          python scrapers/chemist_all.py || echo "::warning::product list not read this time - the saved list is used"
      - name: Translate more product names (AI)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/translate_chemist.py || echo "::warning::names not translated this time - English is shown"
      - name: Save the product list
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          for f in data/chemist_all.json data/chemist_translations.json; do [ ! -f "$f" ] || git add "$f"; done
          git diff --staged --quiet && exit 0
          git commit -m "小黃屋 product list and names [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 20
          done
          echo "::warning::product list not saved this time"
      - name: Use the newest catalogue
        # the specials update may have saved a newer catalogue while this ran
        run: git fetch origin main && git checkout FETCH_HEAD -- static/data/specials.json
      - name: Build
        run: python scripts/build_chemist.py
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx -y wrangler@4 pages project list | grep -q 'au-pharmacy-specials' \
            || npx -y wrangler@4 pages project create au-pharmacy-specials --production-branch=main
          npx -y wrangler@4 pages deploy chemist --project-name=au-pharmacy-specials --branch=main
      - name: Visitor statistics (Cloudflare Web Analytics, same as the other sites)
        # turns it on once for au-pharmacy-specials.pages.dev (Cloudflare adds its counter to the pages itself);
        # if the key may not do this, the owner turns it on in the Cloudflare dashboard - the site works either way
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: 9289bcfaff4b5d32ee32e7b83bf4a687
          HOST: au-pharmacy-specials.pages.dev
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/rum/site_info"
          list=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/list?per_page=100")
          if [ "$(echo "$list" | jq -r '.success')" != "true" ]; then
            echo "::warning::Web Analytics: this key cannot read the site list - turn it on in the Cloudflare dashboard"
            echo "$list" | jq -c '.errors' ; exit 0
          fi
          if echo "$list" | jq -e --arg h "$HOST" '.result[] | select(.host == $h)' >/dev/null; then
            echo "Web Analytics already on for $HOST"; exit 0
          fi
          res=$(curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
                -d "{\"host\":\"$HOST\",\"auto_install\":true}" "$API")
          if [ "$(echo "$res" | jq -r '.success')" = "true" ]; then echo "Web Analytics turned on for $HOST"
          else echo "::warning::Web Analytics not turned on - do it in the Cloudflare dashboard"; echo "$res" | jq -c '.errors'; fi
