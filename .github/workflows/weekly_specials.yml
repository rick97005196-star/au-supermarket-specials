name: Weekly Supermarket Specials Auto-Update

on:
  schedule:
    # Runs every Wednesday at 07:00 AEST (Tuesday 21:00 UTC)
    - cron: '0 21 * * 2'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  update-specials:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scrapers and Update Database
        run: |
          python -c "from scrapers.updater import update_all_stores; update_all_stores(max_catalogue_pages=10)"

      - name: Export Static JSON for Cloudflare Pages
        run: |
          python export_static_data.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/specials.db static/data/specials.json static/data/stats.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update weekly specials [skip ci]" && git push)
