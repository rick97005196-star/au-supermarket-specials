name: Woolworths specials lists check (one-off, saves nothing)
on:
  push:
    branches: [claude/woolies-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python tools/woolies_probe.py
