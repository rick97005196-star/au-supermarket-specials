name: CW probe (test only)
on:
  push:
    branches: [claude/cw-probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: npm i playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node tools/cw_probe.cjs
      - uses: actions/upload-artifact@v4
        with: { name: probe, path: probe }
