name: 快速部署網頁（只改畫面時使用）

on:
  push:
    branches: [main]
    paths:
      - 'static/*.html'
      - 'static/*.css'
      - 'static/*.js'
      - 'static/*.txt'
      - 'static/*.xml'
      - 'static/*.png'
      - 'functions/**'
      - 'tailwind.config.js'
  workflow_dispatch:

# Own queue: in the specials update's queue a waiting run is replaced by the next one, and that run
# only goes online when it has new data, so a change to the pages could stay offline
concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04   # fixed version: "latest" switches to Ubuntu 26 from 19 Oct 2026
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build CSS
        run: npx -y tailwindcss@3 -c tailwind.config.js -i tailwind.input.css -o static/tw.css --minify || echo "using committed static/tw.css"
      - name: Use the newest data
        # the specials update may have put newer data online while this ran; do not put older data back
        run: git fetch origin main && git checkout FETCH_HEAD -- static/data
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx -y wrangler@4 pages deploy static --project-name=au-supermarket-specials --branch=main
