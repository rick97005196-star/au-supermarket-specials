name: diag-tmp
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q -r requirements.txt
      - run: |
          python - <<'PY'
          import traceback, sys
          sys.path.insert(0, '.')
          import scrapers.coles_scraper as c
          import scrapers.woolies_scraper as w
          orig = c._get
          def spy(url, **kw):
              try:
                  r = orig(url, **kw)
                  print(f"::warning::GET {url[:90]} kw={list(kw)} -> {getattr(r,'status_code',r)}")
                  return r
              except Exception as e:
                  print(f"::warning::GET {url[:90]} EXC {e!r}"[:400]); raise
          c._get = spy
          try:
              from curl_cffi import requests as _x
              print("::warning::curl_cffi import OK " + str(_x.Session))
              _x.Session(impersonate='chrome')
          except Exception as e:
              print(f"::warning::curl_cffi FAIL {e!r}")
          print(f"::warning::session type {type(c._session())} {getattr(c._session(),'impersonate',None)}")
          try:
              cats = c.discover_coles_catalogues(8328, 'QLD')
              print(f"::warning::coles QLD -> {[(x['id'], x['date_range']) for x in cats]}")
          except Exception:
              print("::warning::" + traceback.format_exc().replace(chr(10), ' | ')[-600:])
          PY
