name: Diag Woolworths API (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests curl_cffi
      - name: Probe
        shell: python
        run: |
          import requests, json
          U='https://www.woolworths.com.au/apis/ui/Search/products'
          P={'SearchTerm':'half price','PageSize':36,'PageNumber':1}
          H={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36','Accept':'application/json','Accept-Language':'en-AU,en;q=0.9'}
          def rep(name, r):
              n='-'
              try: n=len(r.json().get('Products') or [])
              except Exception: pass
              print(f"::notice::{name}: status={r.status_code} bundles={n}")
          try: rep('A requests plain', requests.get(U,params=P,headers=H,timeout=20))
          except Exception as e: print(f"::notice::A error {e}")
          try:
              s=requests.Session(); s.headers.update(H); s.get('https://www.woolworths.com.au/',timeout=20)
              rep('B requests+cookies', s.get(U,params=P,timeout=20))
          except Exception as e: print(f"::notice::B error {e}")
          from curl_cffi import requests as cr
          for imp in ['chrome','safari','chrome124']:
              try:
                  s=cr.Session(impersonate=imp); s.get('https://www.woolworths.com.au/',timeout=25)
                  rep(f'C curl_cffi {imp}+cookies', s.get(U,params=P,timeout=25))
              except Exception as e: print(f"::notice::C {imp} error {str(e)[:150]}")
