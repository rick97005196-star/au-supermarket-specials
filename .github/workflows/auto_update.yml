name: Weekly Specials Auto Update & Deploy

on:
  schedule:
    # 澳洲時間週一至週三，每 30 分鐘自動檢查與爬取新資料 (AEST Monday 00:00 ~ Wednesday 23:00)
    # GitHub 在整點最忙，排程常被延後或略過，所以避開整點，改在每小時的 17 分與 47 分執行
    # AEST (UTC+10) 換算為 UTC：
    # 1) 澳洲週一 00:00 - 09:00 (UTC 週日 14:00 - 23:00)
    - cron: '17,47 14-23 * * 0'
    # 2) 澳洲週一 10:00 - 週二 09:00 (UTC 週一全天每小時)
    - cron: '17,47 * * * 1'
    # 3) 澳洲週二 10:00 - 週三 09:00 (UTC 週二全天每小時)
    - cron: '17,47 * * * 2'
    # 4) 澳洲週三 10:00 - 週三 23:00 (UTC 週三 00:00 - 13:00)
    - cron: '17,47 0-13 * * 3'
    # 澳洲時間週三凌晨 00:01 準時換檔更新 (UTC 週二 14:01)
    - cron: '1 14 * * 2'
    # 澳洲週四至週日，每天上午 10:23 與晚上 10:23 例行檢查兩次
    - cron: '23 0,12 * * 0,4,5,6'
  # 1) Cloudflare 定時器（cloudflare/update-timer）每 30 分鐘準時從這裡啟動更新（主要方式）
  # 2) 也可以在 GitHub 網頁 Actions 標籤上一鍵手動立即執行
  # 上面 GitHub 自己的排程保留當備援：它常被略過，但定時器出問題時至少還有它
  workflow_dispatch:
    inputs:
      source:
        description: '由誰啟動（cloudflare = 定時器；key-check = 部署定時器時的金鑰測試；手動執行請保持 manual）'
        required: false
        default: 'manual'
        type: string

run-name: ${{ github.event_name == 'schedule' && '定時更新（GitHub 備援排程）' || (inputs.source == 'cloudflare' && '定時更新（Cloudflare 定時器）' || (inputs.source == 'key-check' && '金鑰測試（部署定時器時自動檢查）' || '手動更新')) }}

concurrency:
  group: weekly-specials-update
  cancel-in-progress: false

permissions:
  contents: write
  actions: read      # only to check that the Cloudflare timer is still starting updates

jobs:
  update-and-deploy:
    runs-on: ubuntu-24.04   # fixed version: "latest" switches to Ubuntu 26 from 19 Oct 2026

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: main  # always start from the latest main (not the SHA at trigger time)

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests beautifulsoup4

      - name: Run Supermarket Scrapers
        run: |
          python -c "from scrapers.updater import update_all_stores; update_all_stores(max_catalogue_pages=50)"

      # Products no category rule recognises: the AI picks the department (it also sees the
      # supermarket's own aisle). If the AI is unavailable the aisle is used - nothing breaks.
      - name: Sort new products the rules do not know (AI)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/ai_categorize.py || echo "::warning::AI categories skipped this time (the supermarket aisles are used)"

      - name: Generate Multilingual Translations
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/auto_translate.py

      # What visitors really look at (anonymous counts) helps decide the default order (interest.py)
      - name: Download visitor interest
        run: python scripts/fetch_interest.py || echo "::warning::visitor interest skipped this time"

      - name: Export Static Data for Cloudflare Pages
        run: |
          python export_static_data.py

      # ---- Layer 2 + 3: check the new data before it goes anywhere ----
      - name: Check data before publishing
        id: check
        run: python scripts/check_data.py pre

      # ---- Layer 5: only save when the specials really changed (keeps the repo small) ----
      - name: Commit and Push Updated Data
        if: steps.check.outputs.changed == 'true' && steps.check.outputs.block != 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          for f in data/specials.db data/catalogues.json data/coles_web.json data/woolies_web.json data/catalogue_items.json.gz data/ai_categories.json data/interest.json static/data/specials.json static/data/stats.json static/data/translations.json; do [ ! -f "$f" ] || git add "$f"; done
          git diff --staged --quiet || (git commit -m "Auto-update weekly specials & translations [skip ci]" && git pull --rebase -X theirs origin main && git push origin main)

      # ---- The scrapers' saved copies (catalogues already downloaded, half-price lists read so far)
      #      are kept even when the website itself did not change, so the next update does not have
      #      to download them again ----
      - name: Save downloaded catalogues for the next update
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          for f in data/catalogues.json data/coles_web.json data/woolies_web.json data/catalogue_items.json.gz data/ai_categories.json; do [ ! -f "$f" ] || git add "$f"; done
          git diff --staged --quiet || (git commit -m "Save scraper memory [skip ci]" && git pull --rebase -X theirs origin main && git push origin main) || echo "memory not saved this time"

      - name: Build CSS (pre-built Tailwind, fast on phones)
        if: steps.check.outputs.changed == 'true' && steps.check.outputs.block != 'true'
        run: npx -y tailwindcss@3 -c tailwind.config.js -i tailwind.input.css -o static/tw.css --minify || echo "CSS build skipped, using committed static/tw.css"

      - name: Deploy to Cloudflare Pages
        if: steps.check.outputs.changed == 'true' && steps.check.outputs.block != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler pages deploy static --project-name=au-supermarket-specials --branch=main

      # ---- Layer 4: make sure the live website really shows the new data ----
      - name: Verify live website
        if: steps.check.outputs.changed == 'true' && steps.check.outputs.block != 'true'
        run: python scripts/check_data.py post

      # ---- Layer 3: anything wrong -> mark this run as failed so GitHub emails the owner ----
      - name: Alert owner if something needs attention
        if: steps.check.outputs.alert != ''
        env:
          ALERT: ${{ steps.check.outputs.alert }}
        run: |
          echo "::error::需要注意：$ALERT"
          exit 1

      # ---- Is the Cloudflare timer still starting the updates? (checked when GitHub's backup
      #      schedule ran; emails the owner if the timer stopped, e.g. its key expired) ----
      - name: Check the Cloudflare update timer
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_timer.py
