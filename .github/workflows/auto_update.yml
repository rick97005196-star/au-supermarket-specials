name: Weekly Specials Auto Update & Deploy

on:
  schedule:
    # 澳洲時間週一至週三，每小時整點自動檢查與爬取新資料 (AEST Monday 00:00 ~ Wednesday 23:00)
    # AEST (UTC+10) 換算為 UTC：
    # 1) 澳洲週一 00:00 - 09:00 (UTC 週日 14:00 - 23:00)
    - cron: '0 14-23 * * 0'
    # 2) 澳洲週一 10:00 - 週二 09:00 (UTC 週一全天每小時)
    - cron: '0 * * * 1'
    # 3) 澳洲週二 10:00 - 週三 09:00 (UTC 週二全天每小時)
    - cron: '0 * * * 2'
    # 4) 澳洲週三 10:00 - 週三 23:00 (UTC 週三 00:00 - 13:00)
    - cron: '0 0-13 * * 3'
    # 澳洲時間週三凌晨 00:01 準時換檔更新 (UTC 週二 14:01)
    - cron: '1 14 * * 2'
    # 澳洲週四至週日，每天上午 10:00 (UTC 00:00) 例行檢查一次
    - cron: '0 0 * * 0,4,5,6'
  workflow_dispatch: # 支援在 GitHub 網頁 Actions 標籤上一鍵手動立即執行

concurrency:
  group: weekly-specials-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests beautifulsoup4

      - name: Run Supermarket Scrapers
        run: |
          python -c "from scrapers.updater import update_all_stores; update_all_stores(max_catalogue_pages=50)"

      - name: Generate Multilingual Translations
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/auto_translate.py

      - name: Export Static Data for Cloudflare Pages
        run: |
          python export_static_data.py

      - name: Commit and Push Updated Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/specials.db static/data/specials.json static/data/stats.json static/data/translations.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update weekly specials & translations [skip ci]" && git pull --rebase origin main && git push origin main)

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler pages deploy static --project-name=au-supermarket-specials --branch=main
