name: Weekly Specials Auto Update & Deploy

on:
  schedule:
    # 澳洲時間週一至週三，每小時整點自動檢查與爬取新資料 (AEST Monday 00:00 ~ Wednesday 23:00)
    # AEST (UTC+10) 換算為 UTC：
    # 1) 澳洲週一 00:00 - 09:00 (UTC 週日 14:00 - 23:00)
    - cron: '0 14-23 * * 0'
    # 2) 澳洲週一 10:00 - 週二 09:00 (UTC 週一全天每小時)
    - cron: '0 * * * 1'
    # 3) 澳洲週二 10:00 - 週三 09:00 (UTC 週二全天每小時)
    - cron: '0 * * * 2'
    # 4) 澳洲週三 10:00 - 週三 23:00 (UTC 週三 00:00 - 13:00)
    - cron: '0 0-13 * * 3'
    # 澳洲時間週三凌晨 00:01 準時換檔更新 (UTC 週二 14:01)
    - cron: '1 14 * * 2'
    # 澳洲週四至週日，每天上午 10:00 (UTC 00:00) 例行檢查一次
    - cron: '0 0 * * 0,4,5,6'
  workflow_dispatch: # 支援在 GitHub 網頁 Actions 標籤上一鍵手動立即執行

concurrency:
  group: weekly-specials-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: main  # always start from the latest main (not the SHA at trigger time)

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests beautifulsoup4

      - name: Run Supermarket Scrapers
        run: |
          python -c "from scrapers.updater import update_all_stores; update_all_stores(max_catalogue_pages=50)"

      - name: Generate Multilingual Translations
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/auto_translate.py

      - name: Export Static Data for Cloudflare Pages
        run: |
          python export_static_data.py

      # ---- Layer 2 + 3: check the new data before it goes anywhere ----
      - name: Check data before publishing
        id: check
        run: python scripts/check_data.py pre

      # ---- Layer 5: only save when the specials really changed (keeps the repo small) ----
      - name: Commit and Push Updated Data
        if: steps.check.outputs.changed == 'true' && steps.check.outputs.block != 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/specials.db data/catalogues.json data/coles_web.json static/data/specials.json static/data/stats.json static/data/translations.json
          git diff --staged --quiet || (git commit -m "Auto-update weekly specials & translations [skip ci]" && git pull --rebase -X theirs origin main && git push origin main)

      - name: Build CSS (pre-built Tailwind, fast on phones)
        if: steps.check.outputs.changed == 'true' && steps.check.outputs.block != 'true'
        run: npx -y tailwindcss@3 -c tailwind.config.js -i tailwind.input.css -o static/tw.css --minify || echo "CSS build skipped, using committed static/tw.css"

      - name: Deploy to Cloudflare Pages
        if: steps.check.outputs.changed == 'true' && steps.check.outputs.block != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler pages deploy static --project-name=au-supermarket-specials --branch=main

      # ---- Layer 4: make sure the live website really shows the new data ----
      - name: Verify live website
        if: steps.check.outputs.changed == 'true' && steps.check.outputs.block != 'true'
        run: python scripts/check_data.py post

      # ---- Layer 3: anything wrong -> mark this run as failed so GitHub emails the owner ----
      - name: Alert owner if something needs attention
        if: steps.check.outputs.alert != ''
        env:
          ALERT: ${{ steps.check.outputs.alert }}
        run: |
          echo "::error::需要注意：$ALERT"
          exit 1
