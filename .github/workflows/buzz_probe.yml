name: buzz probe (test only)
on:
  push:
    branches: [claude/buzz-probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python scripts/fetch_buzz.py --force && python tools/buzz_dryrun.py && echo ---- && cat data/buzz.json | python -c "import json,sys; d=json.load(sys.stdin); [print(x['store'], x['votes_pos'], x['comments'], x['posted'][:10], x['title']) for x in d['deals']]"
