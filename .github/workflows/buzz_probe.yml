name: buzz probe (test only)
on:
  push:
    branches: [claude/buzz-probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          for u in "https://www.ozbargain.com.au/deals/coles/feed" "https://www.ozbargain.com.au/deals/woolworths/feed" "https://www.ozbargain.com.au/deals/aldi/feed" "https://www.ozbargain.com.au/deals/coles/feed?page=1" "https://www.reddit.com/r/AussieFrugal/new.json?limit=5" "https://www.reddit.com/r/AussieFrugal/new/.rss" "https://old.reddit.com/r/australia/search.json?q=coles&restrict_sr=1&t=week"; do
            echo "=== $u"; curl -s -o out.txt -w "%{http_code} %{size_download}\n" -A "au-specials-buzz/1.0 (weekly popularity)" "$u" || true; head -c 5000 out.txt; echo; done
