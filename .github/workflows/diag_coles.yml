name: diag coles (temporary)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install curl_cffi
      - shell: python
        run: |
          import json, re, time
          from curl_cffi import requests as r
          def w(m): print('::warning::' + m.replace('\n', ' ')[:900])
          for imp in ['chrome', 'chrome131', 'safari', 'edge']:
              s = r.Session(impersonate=imp)
              try:
                  x = s.get('https://www.coles.com.au/on-special', timeout=30)
              except Exception as e:
                  w(f'{imp} p1 EXC {e}'); continue
              m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', x.text, re.S)
              info = f'{imp} p1 {x.status_code} len={len(x.text)} next={bool(m)}'
              if m:
                  d = json.loads(m.group(1)); sr = d['props']['pageProps'].get('searchResults')
                  info += f" page={d.get('page')} build={d.get('buildId')} total={sr and sr.get('noOfResults')}"
                  if sr:
                      for pg in (2, 50):
                          time.sleep(2)
                          y = s.get(f'https://www.coles.com.au/on-special?page={pg}', timeout=30)
                          m2 = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', y.text, re.S)
                          d2 = json.loads(m2.group(1)) if m2 else {}
                          sr2 = d2.get('props', {}).get('pageProps', {}).get('searchResults')
                          prods = [p for p in (sr2 or {}).get('results', []) if p.get('_type') == 'PRODUCT']
                          info += f' | p{pg} {y.status_code} {d2.get("page")} n={len(prods)} online={sum(1 for p in prods if (p.get("pricing") or {}).get("onlineSpecial"))}'
                          z = s.get(f"https://www.coles.com.au/_next/data/{d['buildId']}/en/on-special.json?page={pg}", timeout=30)
                          info += f' json{pg} {z.status_code} {z.text[:60]!r}'
              else:
                  info += ' ' + re.sub(r'\s+', ' ', x.text[:200])
              w(info)
