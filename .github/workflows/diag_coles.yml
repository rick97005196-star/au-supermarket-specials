name: diag coles (temporary)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install curl_cffi
      - shell: python
        run: |
          import json, re, time, collections
          from curl_cffi import requests as r
          def w(m): print('::warning::' + m.replace('\n', ' ')[:1500])
          s = r.Session(impersonate='chrome')
          def get(pg):
              for a in range(3):
                  try:
                      x = s.get(f'https://www.coles.com.au/on-special?page={pg}', timeout=30)
                      m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', x.text, re.S)
                      if m:
                          d = json.loads(m.group(1)); sr = d['props']['pageProps'].get('searchResults')
                          if sr: return d, sr
                  except Exception as e: pass
                  time.sleep(5)
              return None, None
          t0 = time.time()
          d, sr = get(1)
          f = [x for x in sr.get('filters', []) if x.get('name') == 'Special']
          w('store=' + str(d['props']['pageProps'].get('initStoreId')) + ' filter=' + json.dumps(f)[:1200])
          pages = -(-sr['noOfResults'] // sr['pageSize'])
          c = collections.Counter(); fails = []; seen = set(); ex = []
          for pg in range(1, pages + 1):
              if pg > 1:
                  time.sleep(1); d, sr = get(pg)
              if not sr: fails.append(pg); continue
              for p in sr['results']:
                  if p.get('_type') != 'PRODUCT': continue
                  pr = p.get('pricing') or {}
                  if p['id'] in seen: c['dup'] += 1; continue
                  seen.add(p['id']); c['n'] += 1
                  if pr.get('onlineSpecial'): c['online'] += 1; continue
                  if not p.get('availability'): c['unavail'] += 1
                  now, was = pr.get('now') or 0, pr.get('was') or 0
                  if was and now and now <= was * 0.55: c['half'] += 1
                  elif was and now and now <= was * 0.7: c['30pct+'] += 1
                  elif was: c['was'] += 1
                  else: c['nowas_' + str(pr.get('specialType'))] += 1
                  c['st_' + str(pr.get('specialType'))] += 1
                  if len(ex) < 4 and not was: ex.append(json.dumps({k: p.get(k) for k in ('name','brand','size','pricing')})[:300])
          w(f'pages={pages} fails={fails[:20]} nfail={len(fails)} secs={int(time.time()-t0)} ' + json.dumps(c))
          for e in ex: w(e)
