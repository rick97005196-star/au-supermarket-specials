name: diag coles (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install curl_cffi
      - run: python -c "from scrapers.coles_web import scrape_coles_web_half_price as f; print(len(f()))"
      - run: |
          git config user.email action@github.com; git config user.name bot
          git checkout -b diag-data; git add -f data/coles_web.json; git commit -qm diag; git push -f origin diag-data
