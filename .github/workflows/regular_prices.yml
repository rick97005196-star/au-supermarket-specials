name: Woolworths 平常價（每週）

# Once a week, after the specials change on Wednesday: for this week's Coles / ALDI products that Woolworths
# very likely sells but has no special for, read the Woolworths regular price (scrapers/woolies_regular.py,
# about 1 hour, a few seconds between requests) and save static/data/regular.json.
# No deploy here: the next "Weekly Specials Auto Update & Deploy" run that changes the website puts the file
# online with everything else. Kept out of that workflow's queue on purpose (a waiting run there would be replaced).
on:
  schedule:
    # Wednesday 13:37 Brisbane (UTC+10) = 03:37 UTC; Thursday same time as a backup when Wednesday's run failed
    - cron: '37 3 * * 3'
    - cron: '37 3 * * 4'
  workflow_dispatch:

concurrency:
  group: regular-prices
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regular-prices:
    runs-on: ubuntu-24.04   # fixed version: "latest" switches to Ubuntu 26 from 19 Oct 2026
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Read Woolworths regular prices
        # the scheduled runs skip when this week's prices are already saved (the Thursday backup after a good Wednesday)
        run: python scrapers/woolies_regular.py ${{ github.event_name == 'schedule' && '--if-stale' || '' }}
      - name: Save
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add static/data/regular.json
          git diff --staged --quiet && exit 0
          git commit -m "Weekly Woolworths regular prices [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 20; done
          exit 1
