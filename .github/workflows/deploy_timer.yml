name: 部署 Cloudflare 定時器

# Puts the update timer (cloudflare/update-timer) on Cloudflare, after its checks pass.
# Runs when the timer's code changes, or by hand (Actions > 部署 Cloudflare 定時器 > Run workflow),
# for example after the GitHub key SCHEDULER_GITHUB_TOKEN was added or replaced.
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/update-timer/**'
      - '.github/workflows/deploy_timer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-update-timer
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04   # fixed version: "latest" switches to Ubuntu 26 from 19 Oct 2026
    env:
      HAS_KEY: ${{ secrets.SCHEDULER_GITHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Check the timer rules
        working-directory: cloudflare/update-timer
        run: node --test test/*.test.js

      - name: Put the timer on Cloudflare
        working-directory: cloudflare/update-timer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx -y wrangler@4 deploy

      - name: Give the timer its GitHub key
        if: env.HAS_KEY == 'true'
        working-directory: cloudflare/update-timer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KEY: ${{ secrets.SCHEDULER_GITHUB_TOKEN }}
        run: printf '%s' "$KEY" | npx -y wrangler@4 secret put GH_DISPATCH_TOKEN

      - name: Check the timer's schedule on Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/$1"; }
          acct=$(api accounts | jq -r '.result[0].id // empty')
          if [ -z "$acct" ]; then echo "::notice::無法讀取 Cloudflare 帳號，略過定時規則檢查"; exit 0; fi
          crons=$(api "accounts/$acct/workers/scripts/au-specials-timer/schedules" | jq -r '[.result.schedules[]?.cron] | join(" ; ")')
          if [ "$crons" = "1,17,47 * * * *" ]; then
            echo "::notice::Cloudflare 上的定時規則正確：$crons（UTC）"
          else
            echo "::error::Cloudflare 上的定時規則不對：「$crons」"; exit 1
          fi

      - name: Check the GitHub key can start an update
        if: env.HAS_KEY == 'true'
        env:
          KEY: ${{ secrets.SCHEDULER_GITHUB_TOKEN }}
          BASE: https://api.github.com/repos/${{ github.repository }}/actions/workflows/auto_update.yml
        run: |
          h=(-H "Authorization: Bearer $KEY" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          see=$(curl -sS -o /tmp/see.txt -w '%{http_code}' "${h[@]}" "$BASE/runs?per_page=1")
          start=$(curl -sS -o /tmp/start.txt -w '%{http_code}' -X POST "${h[@]}" "$BASE/dispatches" \
                  -d '{"ref":"main","inputs":{"source":"key-check"}}')
          said=$(jq -r '.message // empty' /tmp/start.txt 2>/dev/null | head -c 200)
          echo "key check: list runs -> HTTP $see, start update -> HTTP $start ($said)"
          if [ "$start" = 204 ]; then
            echo "::notice::金鑰正常：用定時器的金鑰成功啟動了一次測試更新"; exit 0
          elif [ "$see" = 401 ]; then
            echo "::error::金鑰無效（HTTP 401）：可能複製不完整、已刪除或已過期，請重新建立並貼到 SCHEDULER_GITHUB_TOKEN"
          elif [ "$see" = 200 ]; then
            echo "::error::金鑰看得到更新紀錄但不能啟動更新（HTTP $start：$said）：Actions 權限是 Read-only，請改成 Read and write"
          else
            echo "::error::金鑰沒有這個專案的 Actions 權限（查看 HTTP $see、啟動 HTTP $start：$said）：請確認 Repository access 選了 au-supermarket-specials，且 Actions 設為 Read and write"
          fi
          exit 1

      - name: No GitHub key yet
        if: env.HAS_KEY != 'true'
        run: echo "::notice::定時器已部署，但還沒有 GitHub 金鑰（SCHEDULER_GITHUB_TOKEN），所以暫時不會啟動任何更新"
