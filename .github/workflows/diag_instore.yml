name: Diag in-store vs online (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -q curl_cffi
      - name: Probe
        shell: python
        run: |
          from curl_cffi import requests as cr
          import collections, time
          s = cr.Session(impersonate='chrome'); s.get('https://www.woolworths.com.au/', timeout=25)
          U = 'https://www.woolworths.com.au/apis/ui/Search/products'
          c = collections.Counter(); keys = set(); ex = []
          for page in range(1, 61):
              r = s.get(U, params={'SearchTerm': 'half price', 'PageSize': 36, 'PageNumber': page}, timeout=25)
              if r.status_code != 200: c['http_%d' % r.status_code] += 1; break
              bundles = r.json().get('Products') or []
              if not bundles: break
              for b in bundles:
                  for p in b.get('Products', []):
                      keys.update(k for k in p if 'nstore' in k or k in ('IsOnSpecial','WasPrice','Price','IsOnlineOnly','IsMarketProduct','IsAvailable','IsInStock'))
                      if p.get('IsOnlineOnly') or p.get('IsMarketProduct') or p.get('ThirdPartyProductInfo'): c['online_only_or_market'] += 1; continue
                      ip, iw, ios = p.get('InstorePrice'), p.get('InstoreWasPrice'), p.get('InstoreIsOnSpecial')
                      op, ow, oos = p.get('Price'), p.get('WasPrice'), p.get('IsOnSpecial')
                      online_half = bool(oos and ow and op and op <= ow*0.55)
                      store_half = bool(ios and iw and ip and ip <= iw*0.55)
                      if online_half and store_half: c['half_both'] += 1
                      elif online_half and not store_half:
                          c['half_ONLINE_ONLY'] += 1
                          if len(ex) < 6: ex.append(f"{p.get('Name')} | online {op}/{ow} {oos} | instore {ip}/{iw} {ios}")
                      elif store_half: c['half_instore_only'] += 1
                      else: c['not_half'] += 1
                      if ip is None: c['no_instore_price_field'] += 1
              time.sleep(0.2)
          print(f"::notice::counts {dict(c)}")
          print(f"::notice::fields {sorted(keys)}")
          for e in ex: print(f"::notice::example {e[:250]}")
