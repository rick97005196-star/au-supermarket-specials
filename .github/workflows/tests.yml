name: 分類規則自動檢查

# Runs whenever the category rules change: every product that was once in the wrong place
# (tests/category_cases.json) must still land in the right category. A failure emails the owner
# and the website keeps working as before.
on:
  push:
    branches: [main]
    paths:
      - 'categories.py'
      - 'static/category-rules.js'
      - 'static/compare.js'
      - 'tests/**'
      - 'scripts/check_timer.py'
      - 'scripts/ai_categorize.py'
      - 'data/ai_categories.json'
      - 'interest.py'
      - 'functions/**'
      - 'scrapers/regions.py'
      - 'scrapers/coles_scraper.py'
      - 'scrapers/woolies_scraper.py'
      - 'scrapers/woolies_regular.py'
      - 'scrapers/coles_regular.py'
      - 'scrapers/coles_web.py'
      - 'scripts/regular_match.cjs'
      - 'database.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  categories:
    runs-on: ubuntu-24.04   # fixed version: "latest" switches to Ubuntu 26 from 19 Oct 2026
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Category regression test
        run: python tests/test_categories.py
      - name: Timer alarm test
        run: python tests/test_check_timer.py
      - name: Unknown-product placement test
        run: python tests/test_category_hints.py
      - name: Visitor-interest order test
        run: python tests/test_interest.py
      - name: Everyday low price test
        run: python tests/test_everyday.py
      - name: Price comparison test
        run: python tests/test_compare.py
      - name: Woolworths specials lists test
        run: |
          pip install -q requests beautifulsoup4   # the Woolworths reader imports them
          python tests/test_woolies_groups.py
      - name: ALDI everyday range test
        run: python tests/test_aldi_range.py   # needs the packages installed in the step above
      - name: Woolworths regular price test
        run: python tests/test_regular.py
      - name: Coles regular price test
        run: python tests/test_coles_regular.py
